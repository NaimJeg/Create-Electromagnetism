plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.265'

    parchment {
        mappingsVersion = '2024.11.17'
        minecraftVersion = '1.21.1'
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Dependency-free executable checks are separate from framework-discovered unit tests.
sourceSets {
    verification {
        java.srcDir 'src/verification/java'
        compileClasspath = sourceSets.main.output
        runtimeClasspath = output + compileClasspath
    }
}

def verifySignals = tasks.register('verifySignals', JavaExec) {
    group = 'verification'
    description = 'Runs the pure-core signal regression checks.'
    dependsOn tasks.named('verificationClasses')
    classpath = sourceSets.verification.runtimeClasspath
    mainClass = 'com.electromagnetism.core.signal.SignalChecks'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
tasks.named('check') { dependsOn verifySignals }

repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://cursemaven.com' } }
        filter { includeGroup 'curse.maven' }
    }
    maven {
        url "https://maven.sighs.cc/repository/maven-public/"
    }
}

configurations {
    createRelease {
        canBeConsumed = false
        transitive = false
    }
    implementation.extendsFrom createRelease
}

dependencies {
    createRelease 'curse.maven:create-328085:7963363' // Create 6.0.10; also inherited by implementation
    implementation 'curse.maven:create-electro-energetics-1443327:9173792'
    runtimeOnly 'com.sighs.autojs:AutoJS-neoforge-1.21.1:1.0.0'

    // Compatibility testing; the release bundles Simulated and Offroad.
    runtimeOnly 'curse.maven:create-aeronautics-676721:8763471' // 1.3.2
    runtimeOnly 'curse.maven:sable-1312371:8673825' // 2.0.5, includes Sable Companion

    // Compile against the libraries bundled in the release; NeoForge loads them at runtime.
    compileOnly files(provider {
        zipTree(configurations.createRelease.singleFile).matching {
            include 'META-INF/jarjar/*.jar'
        }.files
    })
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: '[1.21.1]',
            neo_version_range      : '[21.1.174,)',
            loader_version_range   : '[1,)',
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            create_version_range   : '[6.0.7,6.1.0)'
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
