plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.265'

    parchment {
        mappingsVersion = '2024.11.17'
        minecraftVersion = '1.21.1'
    }

    runs {
        client {
            client()
            if (project.hasProperty('verificationServerAddress')) {
                gameDirectory = project.file('build/client-verification')
                programArguments.addAll '--quickPlayMultiplayer', project.property('verificationServerAddress')
            }
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Dependency-free executable checks are separate from framework-discovered unit tests.
sourceSets {
    verification {
        java.srcDir 'src/verification/java'
        compileClasspath = sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = output + compileClasspath
    }
}

def verifySignals = tasks.register('verifySignals', JavaExec) {
    group = 'verification'
    description = 'Runs the pure-core signal regression checks.'
    dependsOn tasks.named('verificationClasses')
    classpath = sourceSets.verification.runtimeClasspath
    mainClass = 'com.electromagnetism.core.signal.SignalChecks'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
tasks.named('check') { dependsOn verifySignals }

repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://cursemaven.com' } }
        filter { includeGroup 'curse.maven' }
    }
    maven {
        url "https://maven.sighs.cc/repository/maven-public/"
    }
}

configurations {
    createRelease {
        canBeConsumed = false
        transitive = false
    }
    implementation.extendsFrom createRelease
}

dependencies {
    createRelease 'curse.maven:create-328085:7963363'
    // Compile against the exact support libraries bundled in the Create release.
    compileOnly files(provider {
        zipTree(configurations.createRelease.singleFile).matching {
            include 'META-INF/jarjar/*.jar'
        }.files
    })
    implementation 'curse.maven:create-electro-energetics-1443327:9173792'
    runtimeOnly 'com.sighs.autojs:AutoJS-neoforge-1.21.1:1.0.0'
    runtimeOnly "curse.maven:rhino-416294:8463898"

    runtimeOnly 'curse.maven:create-aeronautics-676721:8763471'
    runtimeOnly 'curse.maven:sable-1312371:8673825'
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: '[1.21.1]',
            neo_version_range      : '[21.1.174,)',
            loader_version_range   : '[1,)',
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            create_version_range   : '[6.0.7,6.1.0)'
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Persisted semiconductor settings must never pass NaN or infinity into CEE.
def verifyElectrical = tasks.register('verifyElectrical', JavaExec) {
    group = 'verification'
    description = 'Checks electrical parameter bounds and finite-value recovery.'
    dependsOn tasks.named('verificationClasses')
    classpath = sourceSets.verification.runtimeClasspath
    mainClass = 'com.electromagnetism.core.model.ElectricalChecks'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
tasks.named('check') { dependsOn verifyElectrical }

// Analytic model and transaction regression; independent of Minecraft initialization.
def verifyModels = tasks.register('verifyModels', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('verificationClasses')
    classpath = sourceSets.verification.runtimeClasspath
    mainClass = 'com.electromagnetism.core.model.ModelRuntimeChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}
tasks.named('check') { dependsOn verifyModels }

def verifyCeeContract = tasks.register('verifyCeeContract', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('verificationClasses')
    classpath = sourceSets.verification.runtimeClasspath
    mainClass = 'com.electromagnetism.integration.cee.CeeContractChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}
tasks.named('check') { dependsOn verifyCeeContract }

['verifySemiconductors': 'com.electromagnetism.integration.cee.SemiconductorChecks',
 'verifyRadio': 'com.electromagnetism.core.signal.RadioChecks',
 'verifyScopeCodec': 'com.electromagnetism.integration.cee.ScopeCodecChecks'].each { taskName, entry ->
    def verificationTask = tasks.register(taskName, JavaExec) {
        group = 'verification'
        dependsOn tasks.named('verificationClasses')
        classpath = sourceSets.verification.runtimeClasspath
        mainClass = entry
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    }
    tasks.named('check') { dependsOn verificationTask }
}

// Dev runs include verification helpers; release jars still contain only main output.
neoForge.mods.electromagnetism.sourceSet(sourceSets.verification)
configurations { ceeBaseline { canBeConsumed = false; transitive = false } }
dependencies { ceeBaseline 'curse.maven:create-electro-energetics-1443327:9173792' }
def verifyBaseline = tasks.register('verifyBaseline') {
    group = 'verification'
    inputs.files(configurations.ceeBaseline)
    doLast {
        def jar = configurations.ceeBaseline.singleFile
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(jar.bytes).encodeHex().toString()
        if (digest != '2362decf60ace66037eb2ae79f34fed57b5f152e0435164f5f91912ea837052f') {
            throw new GradleException("CEE artifact fingerprint changed: " + digest)
        }
        logger.lifecycle('CEE pinned artifact SHA-256 verified')
    }
}
tasks.named('check') { dependsOn verifyBaseline }

// Analytic transients, coupled nonlinear detection, and rejected-step isolation.
def verifyTransients = tasks.register('verifyTransients', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('verificationClasses')
    classpath = sourceSets.verification.runtimeClasspath
    mainClass = 'com.electromagnetism.integration.cee.TransientChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}
tasks.named('check') { dependsOn verifyTransients }
